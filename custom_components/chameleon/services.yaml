apply_scene:
  name: Apply Scene
  description: >-
    Apply a scene to one or more Chameleon light entities. Optionally set
    brightness and transition in the same call so the scene renders at the
    requested values directly. To start animation set transition > 0; to stop
    it set transition = 0 (also expressible as a plain number.set_value call).
  target:
    entity:
      domain: light
      integration: chameleon
  fields:
    scene_name:
      name: Scene Name
      description: Name of the scene (image) to apply
      required: true
      selector:
        text: {}
    brightness:
      name: Brightness
      description: Optional brightness 0-100 (0 = lights off)
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    transition:
      name: Transition
      description: Optional fade duration in seconds (0 = static, no animation)
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          unit_of_measurement: "s"

refresh_scenes:
  name: Refresh Scenes
  description: >-
    Rescan the image directory and update the scene list for every
    Chameleon configuration. Use after adding or removing image files
    in /config/www/chameleon/.
