apply_scene:
  name: Apply Scene
  description: Apply colors from an image scene to a Chameleon configuration
  target:
    entity:
      domain: select
      integration: chameleon
  fields:
    scene_name:
      name: Scene Name
      description: Name of the scene (image) to apply
      required: true
      selector:
        text: {}

start_animation:
  name: Start Animation
  description: >-
    Ensure animation is enabled (sets speed above zero if currently zero)
    and apply a scene
  target:
    entity:
      domain: select
      integration: chameleon
  fields:
    scene_name:
      name: Scene Name
      description: Name of the scene (image) to use for animation
      required: true
      selector:
        text: {}

stop_animation:
  name: Stop Animation
  description: Stop color animation by setting animation speed to 0
  target:
    entity:
      domain: select
      integration: chameleon

refresh_scenes:
  name: Refresh Scenes
  description: >-
    Rescan the image directory and update the scene list for every
    Chameleon configuration. Use after adding or removing image files
    in /config/www/chameleon/.
